# Builds the custom Ghost production image (server + admin) for Coolify.
#
# Flow: install workspace → build admin (produces ghost/core/core/built/admin
# and ghost/core/core/built/embed-renderer in the working tree) → build
# Dockerfile.production target `full` → push to GHCR.
# Coolify deploys the pushed image via compose.coolify.yaml.
#
# Runs on pushes to main and manually. Fork-safe: no TryGhost secrets needed.

name: Build Ghost image for Coolify

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  NODE_VERSION: 22.23.3
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/ghost

jobs:
  build-and-push:
    name: Build and push full image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          # The deploy stage packs content/themes/casper|source (submodules).
          submodules: true

      - uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build admin
        # Produces apps/admin/dist, ghost/core/core/built/admin
        # (asset-delivery) and ghost/core/core/built/embed-renderer
        # (separate-origin previews), which the `full` image stage COPYs
        # from the build context.
        run: pnpm nx run @tryghost/admin:build

      - name: Determine build version
        # Baked into the image as GHOST_BUILD_VERSION (server-reported version).
        run: |
          PKG_VERSION=$(jq -r .version ghost/core/package.json)
          echo "GHOST_BUILD_VERSION=${PKG_VERSION}+${GITHUB_SHA:0:7}" >> $GITHUB_ENV

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build and push full image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.production
          target: full
          build-args: |
            NODE_VERSION=${{ env.NODE_VERSION }}
            GHOST_BUILD_VERSION=${{ env.GHOST_BUILD_VERSION }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
